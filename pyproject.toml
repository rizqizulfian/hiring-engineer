[project]
name = "nesra-weekly-report"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2",  # Starlette's TestClient now uses httpx2, the successor to httpx
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
